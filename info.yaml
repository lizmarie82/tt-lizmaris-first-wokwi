# Tiny Tapeout project information (Wokwi project)
project:
  wokwi_id: "476698443791693825" # Set this to the ID of your Wokwi project (the number from the project's URL)
  title: "Lizmari´s first Wokwi design" # Project title
  author: "Lizmarie Camacho" # Your name
  discord: "" # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description: "Controlador digital para hidroponía que recibe señales de sensores
    y activa automáticamente alarmas, bomba, ventilación, iluminación y estados
    de protección mediante lógica combinacional." # One line description of what your project does
  language: "Wokwi" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz: 2 # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1" # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).

pinout:
  # Inputs
  ui[0]: "LEVEL_LOW"
  ui[1]: "AIR_TEMP_HIGH"
  ui[2]: "PH_ALERT"
  ui[3]: "EC_ALERT"
  ui[4]: "HUMIDITY_HIGH"
  ui[5]: "LIGHT_LOW"
  ui[6]: "WATER_TEMP_HIGH"
  ui[7]: "FLOW_FAULT"

  # Outputs
  uo[0]: "ALARM"
  uo[1]: "PUMP_EN"
  uo[2]: "FAN_EN"
  uo[3]: "LIGHT_EN"
  uo[4]: "FILL_EN"
  uo[5]: "NUTRIENT_ALERT"
  uo[6]: "CRITICAL"
  uo[7]: "SYSTEM_NORMAL"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
